<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Cozy pastel coding desk with a PC" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- background blobs -->
  <ellipse cx="400" cy="300" rx="350" ry="270" fill="#F6E9FB"/>
  <ellipse cx="200" cy="170" rx="120" ry="90" fill="#FDE7EF" opacity="0.9"/>
  <ellipse cx="620" cy="440" rx="130" ry="90" fill="#DDF1E8" opacity="0.9"/>

  <!-- clouds -->
  <g fill="#FFFFFF" opacity="0.9">
    <ellipse cx="640" cy="110" rx="42" ry="16"/><ellipse cx="662" cy="98" rx="24" ry="14"/><ellipse cx="620" cy="100" rx="20" ry="12"/>
    <ellipse cx="130" cy="290" rx="34" ry="12"/><ellipse cx="148" cy="281" rx="18" ry="10"/>
  </g>

  <!-- floating code symbols -->
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="700" fill="#B9A8E8">
    <text x="120" y="190" font-size="38" transform="rotate(-12 120 190)">&lt;/&gt;</text>
    <text x="628" y="200" font-size="40" fill="#F4A9C0" transform="rotate(10 628 200)">{ }</text>
    <text x="690" y="330" font-size="34" fill="#9AD6BC">#</text>
    <text x="90" y="380" font-size="30" fill="#F7C59F">;</text>
  </g>

  <!-- sparkles -->
  <g fill="#FFE59A" stroke="#5B5470" stroke-width="2" stroke-linejoin="round">
    <path d="M205 100 l6 14 14 6 -14 6 -6 14 -6 -14 -14 -6 14 -6z"/>
    <path d="M585 70 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z"/>
  </g>
  <g fill="#F4A9C0"><circle cx="300" cy="80" r="5"/><circle cx="700" cy="250" r="5"/><circle cx="80" cy="470" r="5"/></g>

  <!-- desk -->
  <rect x="110" y="430" width="580" height="28" rx="14" fill="#F3C9A8" stroke="#5B5470" stroke-width="5"/>
  <rect x="150" y="458" width="18" height="100" rx="6" fill="#E9B48D" stroke="#5B5470" stroke-width="5"/>
  <rect x="632" y="458" width="18" height="100" rx="6" fill="#E9B48D" stroke="#5B5470" stroke-width="5"/>

  <!-- monitor stand -->
  <rect x="380" y="346" width="40" height="76" rx="6" fill="#CFC6EE" stroke="#5B5470" stroke-width="5"/>
  <rect x="330" y="416" width="140" height="16" rx="8" fill="#CFC6EE" stroke="#5B5470" stroke-width="5"/>

  <!-- monitor body -->
  <rect x="235" y="120" width="330" height="232" rx="22" fill="#E6E0FA" stroke="#5B5470" stroke-width="5"/>
  <!-- screen -->
  <rect x="253" y="138" width="294" height="180" rx="12" fill="#4A4468" stroke="#5B5470" stroke-width="3"/>
  <!-- window dots -->
  <circle cx="273" cy="156" r="5" fill="#F4A9C0"/>
  <circle cx="291" cy="156" r="5" fill="#FFE59A"/>
  <circle cx="309" cy="156" r="5" fill="#9AD6BC"/>
  <rect x="253" y="168" width="294" height="2" fill="#5F5985"/>
  <!-- code lines -->
  <g>
    <rect x="272" y="184" width="46" height="9" rx="4.5" fill="#F4A9C0"/>
    <rect x="326" y="184" width="80" height="9" rx="4.5" fill="#B9A8E8"/>

    <rect x="290" y="204" width="60" height="9" rx="4.5" fill="#9AD6BC"/>
    <rect x="358" y="204" width="100" height="9" rx="4.5" fill="#FFE59A"/>

    <rect x="290" y="224" width="36" height="9" rx="4.5" fill="#F7C59F"/>
    <rect x="334" y="224" width="70" height="9" rx="4.5" fill="#CFE6FA"/>
    <rect x="412" y="224" width="40" height="9" rx="4.5" fill="#F4A9C0"/>

    <rect x="308" y="244" width="90" height="9" rx="4.5" fill="#B9A8E8"/>
    <rect x="406" y="244" width="50" height="9" rx="4.5" fill="#9AD6BC"/>

    <rect x="290" y="264" width="52" height="9" rx="4.5" fill="#FFE59A"/>
    <rect x="350" y="264" width="84" height="9" rx="4.5" fill="#F7C59F"/>

    <rect x="272" y="284" width="30" height="9" rx="4.5" fill="#F4A9C0"/>
    <rect x="310" y="284" width="8" height="9" rx="2" fill="#FFFFFF"/>
  </g>
  <!-- little heart on chin -->
  <path d="M400 341 c-8 -8 -16 -2 -10 5 l10 9 10 -9 c6 -7 -2 -13 -10 -5z" fill="#F4A9C0" stroke="#5B5470" stroke-width="2.5" stroke-linejoin="round" transform="translate(0 -12) scale(1)"/>

  <!-- sticky note -->
  <g transform="rotate(8 588 190)">
    <rect x="566" y="160" width="46" height="46" rx="4" fill="#FFF1B8" stroke="#5B5470" stroke-width="3"/>
    <rect x="574" y="172" width="28" height="4" rx="2" fill="#E9B48D"/>
    <rect x="574" y="182" width="22" height="4" rx="2" fill="#E9B48D"/>
    <rect x="574" y="192" width="26" height="4" rx="2" fill="#E9B48D"/>
  </g>

  <!-- keyboard -->
  <rect x="285" y="404" width="230" height="26" rx="10" fill="#FFFFFF" stroke="#5B5470" stroke-width="5"/>
  <g fill="#E6E0FA">
    <rect x="297" y="411" width="14" height="6" rx="2"/><rect x="316" y="411" width="14" height="6" rx="2"/>
    <rect x="335" y="411" width="14" height="6" rx="2"/><rect x="354" y="411" width="14" height="6" rx="2"/>
    <rect x="373" y="411" width="14" height="6" rx="2"/><rect x="392" y="411" width="14" height="6" rx="2"/>
    <rect x="411" y="411" width="14" height="6" rx="2"/><rect x="430" y="411" width="14" height="6" rx="2"/>
    <rect x="449" y="411" width="14" height="6" rx="2"/><rect x="468" y="411" width="34" height="6" rx="2"/>
  </g>
  <rect x="330" y="420" width="140" height="5" rx="2.5" fill="#F4A9C0"/>

  <!-- mouse -->
  <rect x="545" y="408" width="34" height="22" rx="11" fill="#FFFFFF" stroke="#5B5470" stroke-width="4"/>
  <line x1="562" y1="409" x2="562" y2="418" stroke="#5B5470" stroke-width="3"/>

  <!-- mug -->
  <path d="M212 398 h44 v26 a14 14 0 0 1 -14 14 h-16 a14 14 0 0 1 -14 -14z" fill="#FFD9C7" stroke="#5B5470" stroke-width="5" stroke-linejoin="round" transform="translate(-40 -8)"/>
  <path d="M220 400 c14 0 14 22 0 22" fill="none" stroke="#5B5470" stroke-width="5" stroke-linecap="round" transform="translate(-4 -8)"/>
  <rect x="180" y="392" width="44" height="6" fill="#B08968" opacity="0" />
  <g fill="none" stroke="#B9A8E8" stroke-width="4" stroke-linecap="round" opacity="0.9">
    <path d="M160 372 c-8 -10 8 -16 0 -26"/>
    <path d="M178 372 c-8 -10 8 -16 0 -26"/>
  </g>
  <path d="M164 402 l12 12 l12 -12" fill="none" stroke="#F4A9C0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0"/>

  <!-- plant -->
  <g>
    <path d="M618 392 h52 l-7 38 h-38z" fill="#F7C59F" stroke="#5B5470" stroke-width="5" stroke-linejoin="round"/>
    <rect x="612" y="384" width="64" height="12" rx="6" fill="#F3B48A" stroke="#5B5470" stroke-width="5"/>
    <ellipse cx="628" cy="350" rx="12" ry="32" fill="#9AD6BC" stroke="#5B5470" stroke-width="4" transform="rotate(-28 628 350)"/>
    <ellipse cx="646" cy="340" rx="12" ry="36" fill="#BFE8D2" stroke="#5B5470" stroke-width="4"/>
    <ellipse cx="664" cy="352" rx="12" ry="30" fill="#9AD6BC" stroke="#5B5470" stroke-width="4" transform="rotate(28 664 352)"/>
  </g>

  <!-- small book stack on desk (left of monitor) -->
  <g stroke="#5B5470" stroke-width="4" stroke-linejoin="round">
    <rect x="250" y="410" width="0" height="0" fill="none"/>
  </g>

  <!-- cozy rug shadow under desk -->
  <ellipse cx="400" cy="566" rx="270" ry="14" fill="#DCCFF0" opacity="0.7"/>
</svg>
